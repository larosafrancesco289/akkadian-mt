# Capacity extension: ByT5-large (1.2B) + dictionary glosses, seed 52.

data:
  data_dir: data/raw
  val_split: 0.1
  val_split_strategy: doc_id
  val_group_column: oare_id
  max_source_length: 512
  max_target_length: 384
  data_mode: prepared
  prepared_file: data/processed/golden_corpus_v2_prefilt.csv
  source_prefix: "translate Akkadian to English: "
  filter_quality: true
  max_length_ratio: 10.0
  min_translation_chars: 10
  use_dictionary_gloss: true
  max_glosses: 6
  strip_homophone_subscripts: true
  holdout_doc_ids_file: data/processed/coursework_holdout_doc_ids.json

model:
  model_type: hf_seq2seq
  model_name: google/byt5-large

train:
  seed: 52
  optimizer: adafactor
  epochs: 20
  batch_size: 4
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_steps: 200
  gradient_accumulation_steps: 8
  fp16: false
  bf16: true
  gradient_checkpointing: true
  max_grad_norm: 1.0
  early_stopping_patience: 6
  eval_steps: 99999
  eval_epochs: 1
  save_steps: 99999
  output_dir: outputs/coursework/byt5_large_rq3_dictionary_gloss_seed52
  checkpoint_dir: checkpoints/coursework/byt5_large_rq3_dictionary_gloss_seed52
  wandb_project: deep-past
  wandb_run_name: coursework-byt5-large-rq3-dictionary-gloss-seed52
  num_beams: 4
  eval_num_beams: 1
  num_workers: 4
  label_smoothing: 0.1
  no_repeat_ngram_size: 0
  lr_schedule: cosine
