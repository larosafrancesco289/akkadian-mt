# Multi-seed: ByT5-small with explicit numeral tags for decimal and fractional amounts, seed 52.

data:
  data_dir: data/raw
  val_split: 0.1
  val_split_strategy: doc_id
  val_group_column: oare_id
  max_source_length: 512
  max_target_length: 384
  data_mode: prepared
  prepared_file: data/processed/coursework_variants/numeral_normalized/train.csv
  eval_primary_test_file: data/processed/coursework_variants/numeral_normalized/independent_test.csv
  eval_secondary_test_file: data/processed/coursework_variants/numeral_normalized/new_test.csv
  source_prefix: "translate Akkadian to English: "
  filter_quality: true
  max_length_ratio: 10.0
  min_translation_chars: 10
  strip_homophone_subscripts: true
  holdout_doc_ids_file: data/processed/coursework_holdout_doc_ids.json

model:
  model_type: hf_seq2seq
  model_name: google/byt5-small

train:
  seed: 52
  optimizer: adafactor
  epochs: 24
  batch_size: 16
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 200
  gradient_accumulation_steps: 2
  fp16: false
  bf16: true
  gradient_checkpointing: true
  max_grad_norm: 1.0
  early_stopping_patience: 6
  eval_steps: 99999
  eval_epochs: 1
  save_steps: 99999
  output_dir: outputs/coursework/byt5_small_cw4_numeral_normalized_seed52
  checkpoint_dir: checkpoints/coursework/byt5_small_cw4_numeral_normalized_seed52
  wandb_project: deep-past
  wandb_run_name: coursework-byt5-small-cw4-numeral-normalized-seed52
  num_beams: 4
  eval_num_beams: 1
  num_workers: 4
  label_smoothing: 0.1
  no_repeat_ngram_size: 0
  lr_schedule: cosine
