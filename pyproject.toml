[project]
name = "akkadian-mt"
version = "0.1.0"
description = "Byte-level neural machine translation for Old Assyrian Akkadian cuneiform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "sentencepiece>=0.1.99",
    "huggingface-hub>=0.20",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "sacrebleu>=2.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "langdetect>=1.0.9",
    "wandb>=0.16",
    "matplotlib>=3.8",
]

[project.scripts]
akkadian-mt = "akkadian_mt.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "pytest>=7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["akkadian_mt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
